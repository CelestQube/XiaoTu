[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaotu-backend"
version = "0.2.0"
description = "Xiaotu travel assistant backend and reliable tool execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn>=0.38,<1",
  "langchain>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=1.23,<2", "httpx>=0.28,<0.29",
  "PyYAML>=6,<7", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
